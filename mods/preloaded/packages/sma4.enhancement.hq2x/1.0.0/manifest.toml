format_version = 1
id = "sma4.enhancement.hq2x"
version = "1.0.0"
name = "Pixel Smoothing"
author = "mstan"
description = "Optional edge-aware pixel smoothing using the original HQ2x, HQ3x or HQ4x algorithm."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "super-mario-advance-4-us-rev1"
rom_sha1 = "532f3307021637474b6dd37da059ca360f612337"

[[feature]]
id = "hq2x"
name = "Pixel Smoothing"
description = "Smooth pixel edges before fitting the picture to the window. Larger filters use more CPU time and memory. Turn off for normal pixels."
group = "Display"
default_enabled = false

[[plugin]]
feature = "hq2x"
id = "sma4.pixel-smoothing"

[[option]]
feature = "hq2x"
id = "filter"
label = "Filter"
type = "choice"
default = "hq2x"

[[option.choice]]
value = "hq2x"
label = "HQ2x (2x)"

[[option.choice]]
value = "hq3x"
label = "HQ3x (3x)"

[[option.choice]]
value = "hq4x"
label = "HQ4x (4x)"
